<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartiva - Customer Login</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: Arial, sans-serif;
            background-color: #0a1128; color: white;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .login-card {
            background-color: #1c2541; padding: 40px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px;
        }
        h2 { margin-top: 0; color: #00b4d8; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 0.9em; }
        input {
            width: 100%; padding: 12px; box-sizing: border-box;
            background-color: #0b0c10; border: 1px solid #45f3ff33;
            color: white; border-radius: 4px; outline: none;
        }
        .btn {
            width: 100%; background-color: #00b4d8; color: white; border: none;
            padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em;
            margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .divider {
            display: flex; align-items: center; margin: 20px 0; color: #94a3b8;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .divider span { padding: 0 10px; font-size: 0.85em; }
        .error-msg { color: #e63946; font-size: 0.9em; text-align: center; margin-top: 15px; display: none; }
        .google-btn {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
            background-color: #fff; color: #333; border: none;
            padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em;
            margin-top: 10px; transition: box-shadow 0.2s;
        }
        .google-btn:hover { box-shadow: 0 2px 8px rgba(255,255,255,0.2); }
        .google-btn img { width: 20px; height: 20px; }
        .register-link { text-align: center; margin-top: 15px; font-size: 0.9em; }
        .register-link a { color: #00b4d8; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Customer Login</h2>
        
        <!-- Email/Password Login -->
        <form id="customerLoginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="divider"><span>or continue with</span></div>

        <!-- Google Sign-In Button -->
        <div id="g_id_onload"
             data-client_id="29786920881-eek1m6qr22fscqnvm646pv3idvfcth9t.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleGoogleCredential"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <div class="register-link">
            Don't have an account? <a href="#" id="showRegisterLink">Create one</a>
        </div>
    </div>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/google-config.js"></script>
    <script>
const API_URL = (window.CartivaApiBase || window.location.origin) + '/api';

        // Handle Google credential response
        window.handleGoogleCredential = async function(response) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (!response || !response.credential) {
                errorMsg.innerText = 'Google sign-in failed. Please try again.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });

                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server returned an invalid response. Please try again.");
                }

                const data = await res.json();
                if (!res.ok || !data.ok) throw new Error(data.error || 'Google sign-in failed');

                // Store session aligned with js/app.js (cartiva_customer_session_v2)
                localStorage.setItem('cartiva_customer_session_v2', JSON.stringify({ 
                    token: data.token, 
                    email: data.user?.email || '' 
                }));
                window.location.href = '/index.html';

            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.style.display = 'block';
            }
        };

        document.getElementById('customerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server returned an invalid response. Please try again.");
                }

                const data = await res.json();
                if (!res.ok || !data.ok) throw new Error(data.error || 'Invalid email or password');

                // token store aligned with js/app.js (cartiva_customer_session_v2)
                localStorage.setItem('cartiva_customer_session_v2', JSON.stringify({ token: data.token, email: data.user?.email || email }));
                window.location.href = '/index.html';

            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.style.display = 'block';
            }
        });

        // Show registration form (simple alert for now - can be expanded)
        document.getElementById('showRegisterLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Please enter email and password to register.');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Registration failed');

                alert('Account created successfully! You can now login.');
            } catch (err) {
                document.getElementById('errorMsg').innerText = err.message;
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
